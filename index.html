<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>首页 | 柯川</title>
    <meta name="description" content="个人主页、技术博客、清单、友链和关于我。" />
    <link rel="stylesheet" href="styles.css?v=20260525" />
    <script src="site.js?v=20260525" defer></script>
  </head>
  <body>
    <div class="door-effect" aria-hidden="true">
      <span></span>
      <span></span>
    </div>

    <header class="topbar" aria-label="站点导航" data-site-header></header>

    <main>
      <section class="hero" id="home" aria-labelledby="hero-title">
        <div class="sky" aria-hidden="true">
          <span class="meteor meteor-a"></span>
          <span class="meteor meteor-b"></span>
          <span class="meteor meteor-c"></span>
          <span class="meteor meteor-d"></span>
        </div>
        <div class="hero-shade" aria-hidden="true"></div>
        <h1 id="hero-title">
          <span>一段崎岖的旅行</span>
          <span class="typewriter">一生一次的机会</span>
        </h1>
        <a class="scroll-hint" href="#intro" aria-label="下滑查看本站介绍">
          <span></span>
        </a>
      </section>

      <section class="home-content" id="intro">
        <aside class="github-card" aria-label="个人简介" data-profile-card></aside>

        <article class="intro-copy">
          <p class="eyebrow">Come in.</p>
          <nav class="home-posts" aria-label="博客文章" data-home-posts></nav>
          <hr>
          <p style="color: #aaa; font-size: 0.9em;">
            你说「我一直在等你先开口」<br>
            你说「我在年轻时就梦见这一切了」<br>
            你说「我已经原谅你了」<br>
            你说「真是不甘心」<br>
            你说「答应记住最美丽时候的我」<br>
            你说「不想就过了这样的一生」
          </p>
        </article>
      </section>
    </main>
    <footer class="site-footer" data-site-footer></footer>
  </body>
</html>
